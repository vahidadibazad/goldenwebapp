<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1e293b" />
    
    <!-- ============================================= -->
    <!-- ✅ تنظیمات PWA برای موبایل -->
    <!-- ============================================= -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="مدیریت IT" />
    
    <!-- ============================================= -->
    <!-- ✅ Manifest و آیکون‌های PWA -->
    <!-- ============================================= -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    
    <!-- ============================================= -->
    <!-- ✅ عنوان و توضیحات -->
    <!-- ============================================= -->
    <title>مدیریت فناوری اطلاعات</title>
    <meta name="description" content="سیستم یکپارچه مدیریت فناوری اطلاعات سازمان" />
    
    <!-- ============================================= -->
    <!-- ✅ Open Graph (برای اشتراک‌گذاری در شبکه‌های اجتماعی) -->
    <!-- ============================================= -->
    <meta property="og:title" content="مدیریت فناوری اطلاعات" />
    <meta property="og:description" content="سیستم یکپارچه مدیریت فناوری اطلاعات سازمان" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    
    <!-- ============================================= -->
    <!-- ✅ Font Preload (برای سرعت بارگذاری) -->
    <!-- ============================================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
