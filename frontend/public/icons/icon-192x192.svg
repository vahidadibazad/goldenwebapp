<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" ry="96" fill="#0A1628"/>
  
  <!-- Soft glow circles -->
  <circle cx="256" cy="280" r="180" fill="#0F2A4A" opacity="0.6"/>
  
  <!-- People Network (top) -->
  <g fill="#4A90D9" stroke="#7EB6FF" stroke-width="3">
    <!-- Connections -->
    <line x1="200" y1="110" x2="256" y2="80" stroke="#5BA3E0" stroke-width="2.5"/>
    <line x1="256" y1="80" x2="312" y2="110" stroke="#5BA3E0" stroke-width="2.5"/>
    <line x1="200" y1="110" x2="312" y2="110" stroke="#5BA3E0" stroke-width="2.5"/>
    
    <!-- People circles -->
    <circle cx="200" cy="110" r="22"/>
    <circle cx="256" cy="80" r="26"/>
    <circle cx="312" cy="110" r="22"/>
    
    <!-- Person icons inside -->
    <circle cx="200" cy="104" r="8" fill="#E8F1FF"/>
    <path d="M188 122 Q200 112 212 122" fill="none" stroke="#E8F1FF" stroke-width="3" stroke-linecap="round"/>
    
    <circle cx="256" cy="72" r="9" fill="#E8F1FF"/>
    <path d="M242 94 Q256 82 270 94" fill="none" stroke="#E8F1FF" stroke-width="3.5" stroke-linecap="round"/>
    
    <circle cx="312" cy="104" r="8" fill="#E8F1FF"/>
    <path d="M300 122 Q312 112 324 122" fill="none" stroke="#E8F1FF" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Folders (left-bottom) -->
  <g>
    <!-- Back folder -->
    <path d="M80 280 L80 380 Q80 400 100 400 L220 400 Q240 400 240 380 L240 300 L200 300 L180 280 Z" fill="#1E5AA8"/>
    <path d="M80 280 L180 280 L200 300 L240 300 L240 280 Q240 260 220 260 L100 260 Q80 260 80 280" fill="#2B7DE0"/>
    
    <!-- Front folder -->
    <path d="M110 310 L110 410 Q110 430 130 430 L250 430 Q270 430 270 410 L270 330 L230 330 L210 310 Z" fill="#2563B8"/>
    <path d="M110 310 L210 310 L230 330 L270 330 L270 310 Q270 290 250 290 L130 290 Q110 290 110 310" fill="#3B8AEF"/>
    
    <!-- Document inside -->
    <rect x="145" y="340" width="90" height="60" rx="6" fill="#E8F1FF"/>
    <rect x="155" y="352" width="50" height="6" rx="2" fill="#4A90D9"/>
    <rect x="155" y="366" width="70" height="5" rx="2" fill="#A0C4F0"/>
    <rect x="155" y="378" width="60" height="5" rx="2" fill="#A0C4F0"/>
  </g>
  
  <!-- Shield -->
  <g>
    <!-- Shield body -->
    <path d="M320 200 
             L420 230 
             L420 340 
             Q420 400 370 430 
             Q340 450 320 460 
             Q300 450 270 430 
             Q220 400 220 340 
             L220 230 Z" 
          fill="#1A4A8A" stroke="#5BA3E0" stroke-width="8"/>
    
    <!-- Inner shield highlight -->
    <path d="M320 220 
             L400 245 
             L400 335 
             Q400 385 360 410 
             Q340 425 320 435 
             Q300 425 280 410 
             Q240 385 240 335 
             L240 245 Z" 
          fill="#2563B8"/>
  </g>
  
  <!-- Database cylinders inside shield -->
  <g>
    <!-- Top cylinder -->
    <ellipse cx="320" cy="280" rx="55" ry="18" fill="#4A90D9"/>
    <rect x="265" y="280" width="110" height="28" fill="#3B7BC8"/>
    <ellipse cx="320" cy="308" rx="55" ry="18" fill="#2B6BB0"/>
    
    <!-- Middle cylinder -->
    <ellipse cx="320" cy="320" rx="55" ry="18" fill="#4A90D9"/>
    <rect x="265" y="320" width="110" height="28" fill="#3B7BC8"/>
    <ellipse cx="320" cy="348" rx="55" ry="18" fill="#2B6BB0"/>
    
    <!-- Bottom cylinder -->
    <ellipse cx="320" cy="360" rx="55" ry="18" fill="#4A90D9"/>
    <rect x="265" y="360" width="110" height="22" fill="#3B7BC8"/>
    <ellipse cx="320" cy="382" rx="55" ry="18" fill="#2B6BB0"/>
  </g>
  
  <!-- Lock -->
  <g>
    <!-- Lock body -->
    <rect x="295" y="330" width="50" height="40" rx="8" fill="#E8F1FF"/>
    <!-- Lock shackle -->
    <path d="M305 330 L305 315 Q305 300 320 300 Q335 300 335 315 L335 330" 
          fill="none" stroke="#E8F1FF" stroke-width="8" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="320" cy="348" r="7" fill="#1A4A8A"/>
    <rect x="317" y="348" width="6" height="12" rx="2" fill="#1A4A8A"/>
  </g>
</svg>
